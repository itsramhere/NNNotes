# Room's pinned KSP integration registers generated Kotlin sources.  AGP 9 uses
# built-in Kotlin, so retain this compatibility bridge until KSP no longer does.
android.disallowKotlinSourceSets=false
android.useAndroidX=true
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
