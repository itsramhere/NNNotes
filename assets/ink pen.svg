<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <!-- Polished Lacquer Barrel -->
    <linearGradient id="fBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="35%" stop-color="#1a202c" />
      <stop offset="70%" stop-color="#11151c" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Polished Gold Accents -->
    <linearGradient id="fGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Gloss Line -->
    <linearGradient id="fShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <filter id="fShadow" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="3" dy="10" stdDeviation="7" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#fShadow)">
    <!-- Barrel Finial / Blind Cap -->
    <path d="M 445 92 C 458 93.5 464 97 464 100 C 464 103 458 106.5 445 108 Z" fill="url(#fGold)" stroke="#92400e" stroke-width="1" />

    <!-- Resin Barrel -->
    <path d="M 230 87.5 L 445 92 L 445 108 L 230 112.5 Z" fill="url(#fBody)" stroke="#1a202c" stroke-width="1" />
    <!-- Barrel Reflection -->
    <line x1="230" y1="91" x2="445" y2="94" stroke="url(#fShine)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Center Trim Rings -->
    <rect x="221" y="86.5" width="9" height="27" rx="1.5" fill="url(#fGold)" stroke="#92400e" stroke-width="1" />
    <rect x="216" y="87.5" width="3.5" height="25" rx="0.8" fill="url(#fGold)" stroke="#92400e" stroke-width="0.8" />

    <!-- Ergonomic Section / Grip -->
    <path d="M 125 90.5 C 150 92 190 89 216 88 L 216 112 C 190 111 150 108 125 109.5 Z" fill="url(#fBody)" stroke="#1a202c" stroke-width="1" />
    <!-- Section Collar Ring -->
    <rect x="121" y="89.5" width="4" height="21" rx="0.8" fill="url(#fGold)" stroke="#92400e" stroke-width="0.8" />

    <!-- Golden Nib Base & Wings -->
    <path d="M 121 91 C 105 91 80 84 50 100 C 80 116 105 109 121 109 Z" fill="url(#fGold)" stroke="#92400e" stroke-width="1.2" />

    <!-- Two-Tone Silver Inlay Mask -->
    <path d="M 116 93.5 C 104 93.5 87 88 64 100 C 87 112 104 106.5 116 106.5 Z" fill="#f8fafc" opacity="0.85" />
    <path d="M 112 95 C 103 95 90 91.5 74 100 C 90 108.5 103 105 112 105 Z" fill="url(#fGold)" />

    <!-- Breather Hole and Slit -->
    <line x1="49.5" y1="100" x2="90" y2="100" stroke="#451a03" stroke-width="1.1" stroke-linecap="round" />
    <circle cx="91.5" cy="100" r="2.4" fill="#451a03" />

    <!-- Nib Scrollwork Engraving -->
    <path d="M 103 94 C 98 94 95 96.5 96 100 C 95 103.5 98 106 103 106" fill="none" stroke="#b45309" stroke-width="0.9" />
  </g>
</svg>
